[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seislip"
version = "0.1.0"
description = "Research-stage tools for geodetic inversion workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Zelong Guo", email = "zelong.guo@outlook.com" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pyproj",
    "scipy",
]

[project.optional-dependencies]
io = ["netCDF4"]
mesh = ["gmsh"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["seislip*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers"]
testpaths = ["tests"]
python_files = ["test_*.py"]

